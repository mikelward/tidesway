# tidesway made to look and behave like tidewm and tide, as far as its config
# allows (tidewm's experiments/sway/REPORT.md, "Appearance"). `run` puts it
# before each test's config. No bar block: tide's bar is its own Quickshell
# one, a layer surface whose exclusive zone sway honors.

# tidewm's own border, config.h's 1px, which tide's tide.conf takes away
# (its SPEC §6.2); no title bars, no gaps
default_border pixel 1
titlebar_border_thickness 0
titlebar_padding 1
gaps inner 0
gaps outer 0
smart_borders off
# No background: swaybg's would be a layer surface, which GET_OUTPUTS lists,
# where tidewm draws its rootcolor, #222222, itself and lists none; tidesway
# draws the same color (sway/tide/background.c)

# tide's colors, as tidewm's config.h:
# class        border  bg      text    indicator child_border
client.focused   #005577 #005577 #eeeeee #005577 #005577
client.unfocused #444444 #222222 #bbbbbb #444444 #444444
client.urgent    #ff0000 #ff0000 #ffffff #ff0000 #ff0000

# tidewm's behavior where sway has a setting for it
focus_follows_mouse yes
focus_on_window_activation urgent
mouse_warping none
floating_minimum_size 1 x 1
floating_maximum_size -1 x -1
xwayland enable
# No swaynag: a config line sway doesn't know would open its bar of errors,
# a layer surface that takes room from the windows
swaynag_command -
